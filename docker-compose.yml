services:
  backend:
    build:
      context: ./backend
    container_name: parkpick-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: parkpick-web
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
