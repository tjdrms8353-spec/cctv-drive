# CI: push 시 프런트엔드 빌드 + 백엔드 임포트 검증
# 배포는 Render/Netlify의 GitHub 연동(auto deploy on push)으로 처리하며
# deploy hook(RENDER_*_DEPLOY_HOOK)은 사용하지 않습니다.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app; print('FastAPI app OK', len(app.routes), 'routes')"
        working-directory: backend
