# Render Blueprint — GitHub 저장소 연결 후 main 브랜치 push 시 자동 배포됩니다.
# (deploy hook 방식이 아닌 Render 네이티브 Git 연동 사용)
services:
  # 백엔드 API → https://parkpick-api.onrender.com
  - type: web
    name: parkpick-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://parkpick.onrender.com,https://parkpick.netlify.app
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7

  # 프런트엔드 Static Site → https://parkpick.onrender.com
  - type: web
    name: parkpick
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://parkpick-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
